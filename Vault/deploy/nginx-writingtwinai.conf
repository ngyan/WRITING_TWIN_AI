# writingtwinai.com — Phase 0 demo
# Frontend: 127.0.0.1:3010 (Next.js)
# Backend:  127.0.0.1:8011 (FastAPI)
# SSL managed by Certbot — run certbot after placing this file

server {
    server_name writingtwinai.com www.writingtwinai.com;

    # Canonical: www → root
    if ($host = www.writingtwinai.com) {
        return 301 https://writingtwinai.com$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Suppress duplicate Next.js headers
    proxy_hide_header X-Powered-By;
    proxy_hide_header x-nextjs-prerender;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    # Certbot will fill in ssl_certificate paths
}

server {
    listen 80;
    server_name writingtwinai.com www.writingtwinai.com;
    return 301 https://writingtwinai.com$request_uri;
}

# API subdomain
server {
    server_name api.writingtwinai.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    # Certbot will fill in ssl_certificate paths
}

server {
    listen 80;
    server_name api.writingtwinai.com;
    return 301 https://api.writingtwinai.com$request_uri;
}
