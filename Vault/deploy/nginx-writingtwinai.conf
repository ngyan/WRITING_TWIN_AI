# writingtwinai.com — Writing Twin AI
# Frontend (Phase 0): 127.0.0.1:3010 (Next.js)
# API Phase 0:        127.0.0.1:8011 (FastAPI)
# API Sprint 1+2:     127.0.0.1:8010 (FastAPI /v1/*)
# SSL cert: /etc/letsencrypt/live/writingtwinai.com/ (covers writingtwinai.com, api.*, www.*)

server {
    server_name writingtwinai.com www.writingtwinai.com;

    # Canonical: www → root
    if ($host = www.writingtwinai.com) {
        return 301 https://writingtwinai.com$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Suppress duplicate Next.js headers
    proxy_hide_header X-Powered-By;
    proxy_hide_header x-nextjs-prerender;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/writingtwinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writingtwinai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name writingtwinai.com www.writingtwinai.com;
    return 301 https://writingtwinai.com$request_uri;
}

# API subdomain
# /v1/* → Sprint 1+2 backend (port 8010)
# everything else → Phase 0 backend (port 8011)
server {
    server_name api.writingtwinai.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Sprint 1+2 backend — all /v1/ routes
    location /v1/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Phase 0 backend — /rewrite, /feedback, /stats, /responses, /health, etc.
    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/writingtwinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writingtwinai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.writingtwinai.com;
    return 301 https://api.writingtwinai.com$request_uri;
}
